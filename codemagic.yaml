workflows:
  android-workflow:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.27.3
      java: 17
    triggering:
      events:
        - push
    scripts:
      - name: Clear Old Cache
        script: |
          flutter clean
      - name: Set up package dependencies
        script: |
          flutter pub get
      - name: Compile Release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
