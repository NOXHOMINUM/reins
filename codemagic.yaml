workflows:
  android-workflow:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.27.3
      java: 17
    triggering:
      events:
        - push
    scripts:
      - name: Patch Android SDK Configurations
        script: |
          # Force the Android builder tool to use SDK 35 and NDK 27 as required by the plugins
          sed -i '' 's/compileSdk = .*/compileSdk = 35/g' android/app/build.gradle
          sed -i '' 's/targetSdk = .*/targetSdk = 35/g' android/app/build.gradle
          echo "ext { ndkVersion = \"27.0.12077973\" }" >> android/build.gradle
      - name: Reset Cache and Fetch Dependencies
        script: |
          flutter pub cache clean --force
          flutter clean
          flutter pub get
      - name: Compile Release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk


